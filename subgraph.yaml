specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: NFTMarket
    network: sepolia
    source:
      address: "0x38D5bFcF446d816dc95C8B2c639a86C8Fd12EDd2"
      abi: NFTMarket
      startBlock: 10670462
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - NFTDelisted
        - NFTListed
        - NFTSold
      abis:
        - name: NFTMarket
          file: ./abis/NFTMarket.json
      eventHandlers:
        - event: NFTDelisted(indexed uint256,indexed address)
          handler: handleNFTDelisted
        - event: NFTListed(indexed uint256,indexed address,uint256)
          handler: handleNFTListed
        - event: NFTSold(indexed uint256,indexed address,indexed address,uint256)
          handler: handleNFTSold
      file: ./src/nft-market.ts
